<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebra Tiles — Completing the Square</title>
<style>
  /* ===== SHARED THEME (identical across all algebra-tile games) ===== */
  :root{
    --cell:44px; --x2:#2a9d8f; --x:#57b85a; --unit:#f4a924;
    --ink:#1d2b34; --paper:#f7fafb; --line:#d4e2e6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:#eef3f4;-webkit-user-select:none;user-select:none;}
  header{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
         display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
  header h1{font-size:20px;margin:0;font-weight:700;}
  header .meta{margin-left:auto;display:flex;gap:18px;font-size:15px;font-weight:600;}
  header .meta span b{color:var(--x2);}
  main{max-width:1280px;margin:0 auto;padding:20px 24px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;}

  .left{flex:0 0 280px;display:flex;flex-direction:column;gap:18px;}
  .problem{text-align:center;}
  .problem .label{font-size:13px;color:#5b7079;text-transform:uppercase;letter-spacing:.06em;}
  .problem .expr{font-size:34px;font-weight:700;margin:8px 0 0;}
  .problem .expr sup{font-size:.6em;vertical-align:super;}
  .result{margin-top:14px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .result.win .factored{font-size:22px;font-weight:700;color:var(--x2);animation:pop .5s ease;}
  .result .cheer{font-size:15px;color:#2a9d8f;font-weight:600;}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}

  .controls{display:flex;flex-direction:column;gap:10px;}
  button{font:inherit;font-weight:600;padding:11px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:.12s;}
  button:hover{background:#f0f6f7;}
  button.primary{background:var(--x2);color:#fff;border-color:var(--x2);}
  button.primary:hover{background:#23867a;}
  button:disabled{opacity:.45;cursor:not-allowed;}
  .legend{font-size:13px;color:#5b7079;line-height:1.6;}
  .legend .swatch{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:middle;margin-right:6px;}

  .center{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .stage{position:relative;padding:34px 0 0 34px;}
  #workspace{position:relative;
    width:calc(var(--cell) * 10);height:calc(var(--cell) * 10);
    background:var(--paper);border:2px solid #b9ccd2;border-radius:6px;
    background-image:linear-gradient(to right,var(--line) 1px,transparent 1px),
                     linear-gradient(to bottom,var(--line) 1px,transparent 1px);
    background-size:var(--cell) var(--cell);}
  .hint-msg{font-size:13px;color:#5b7079;min-height:18px;}

  .dimlabel{position:absolute;font-weight:700;color:var(--x2);font-size:17px;display:none;align-items:center;justify-content:center;}
  .dimlabel.top{top:8px;height:24px;border-bottom:3px solid var(--x2);}
  .dimlabel.left{left:6px;width:24px;writing-mode:vertical-rl;transform:rotate(180deg);border-right:3px solid var(--x2);}
  .edgehi{position:absolute;background:rgba(42,157,143,.16);display:none;pointer-events:none;border:1px dashed var(--x2);}
  .corner-hint{position:absolute;left:0;top:0;width:calc(var(--cell)*3);height:calc(var(--cell)*3);
    border:3px dashed var(--x2);border-radius:6px;background:rgba(42,157,143,.12);display:none;pointer-events:none;}
  .corner-hint.show{display:block;animation:flash 1.6s ease;}
  @keyframes flash{0%,100%{opacity:0}20%,80%{opacity:1}}

  .right{flex:1 1 320px;min-width:300px;}
  .right h2{font-size:14px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.05em;color:#5b7079;}
  .right .hint{font-size:12px;color:#7f939b;margin:0 0 12px;}
  #tray{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;min-height:120px;}

  .tile{position:relative;border-radius:5px;border:1px solid rgba(0,0,0,.18);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;
    cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.18);touch-action:none;}
  .tile.dragging{cursor:grabbing;box-shadow:0 6px 16px rgba(0,0,0,.3);opacity:.92;}
  .tile.x2{background:var(--x2);font-size:18px;}
  .tile.x{background:var(--x);font-size:15px;}
  .tile.unit{background:var(--unit);font-size:12px;}
  .tile sup{font-size:.6em;vertical-align:super;}

  .endcard{flex:1 1 100%;text-align:center;padding:30px;}
  .endcard h2{font-size:24px;}
</style>
</head>
<body>

<header>
  <h1>🟦 Algebra Tiles — Completing the Square</h1>
  <div class="meta">
    <span>Question <b id="qnum">1</b>/10</span>
    <span>Score <b id="score">0</b></span>
  </div>
</header>

<main>
  <section class="left">
    <div class="panel problem">
      <div class="label" id="prompt">Complete the square</div>
      <div class="expr" id="expr"></div>
      <div class="result" id="result"></div>
    </div>
    <div class="panel controls">
      <button class="primary" id="nextBtn" disabled>Next →</button>
      <button id="resetBtn">↺ Reset workspace</button>
      <button id="hintBtn">💡 Show hint</button>
    </div>
    <div class="panel legend">
      <div><span class="swatch" style="background:var(--x2)"></span> x²-tile (x by x)</div>
      <div><span class="swatch" style="background:var(--x)"></span> x-tile (x by 1)</div>
      <div><span class="swatch" style="background:var(--unit)"></span> unit-tile (1 by 1)</div>
    </div>
  </section>

  <section class="center">
    <div class="stage">
      <div class="dimlabel top" id="dimTop"></div>
      <div class="dimlabel left" id="dimLeft"></div>
      <div id="workspace">
        <div class="edgehi" id="hiTop"></div>
        <div class="edgehi" id="hiLeft"></div>
        <div class="corner-hint" id="cornerHint"></div>
      </div>
    </div>
    <div class="hint-msg" id="goal"></div>
  </section>

  <section class="right panel">
    <h2>Tile supply</h2>
    <p class="hint">Drag tiles onto the grid. Double-click an x-tile to rotate it 90°.</p>
    <div id="tray"></div>
  </section>
</main>

<script>
"use strict";

/* =========================================================================
   GAME CONFIG  — the ONLY part that differs between algebra-tile games.
   (See CLAUDE.md for the shared contract.)
   ========================================================================= */
const GAME = {
  goal: "Arrange every tile into one solid square — no gaps, no overlaps.",

  // even b only (b/2 is whole): fixed progression 2,4,6,8,10 then 5 random.
  buildSession(){
    const set=[2,4,6,8,10], qs=set.slice();
    for(let i=0;i<5;i++) qs.push(set[Math.floor(Math.random()*set.length)]);
    return qs;  // each Q is just the number b
  },
  exprHTML(b){ return `x<sup>2</sup> + ${b}x + ?`; },
  // exact supply: 1 x², b x-tiles, (b/2)² unit tiles  -> completes to (x + b/2)²
  supply(b){ return [{type:'x2',n:1},{type:'x',n:b},{type:'unit',n:(b/2)*(b/2)}]; },

  // win only when the filled shape is a SQUARE whose side reads x + b/2
  check(b,w,h){
    if(w!==h) return null;                 // must be a square, not just any rectangle
    const k=w-X;                           // side length L cells = "x + (L-X)"
    if(k>=1 && k===b/2){
      const lab=`x + ${k}`;
      return {identity:`x² + ${b}x + ${k*k} = (x + ${k})²`, topLabel:lab, leftLabel:lab, cheer:'🎉 Perfect square!'};
    }
    return null;
  }
};

/* =========================================================================
   SHARED ENGINE  — identical in every algebra-tile game. Do not fork.
   ========================================================================= */
const X=3, GRID=10, CELL=44;
const workspace=document.getElementById('workspace');
const tray=document.getElementById('tray');

let session=GAME.buildSession();
let qIndex=0, score=0, tiles=[], solved=false, Q=null, seq=0;

/* ---- tile factory ---- */
function makeTile(type){
  const t={id:++seq,type,orientation:'h',placed:false,gx:0,gy:0};
  const el=document.createElement('div');
  el.className='tile '+type;
  if(type==='x2'){t.w=X;t.h=X;el.innerHTML='x<sup>2</sup>';}
  else if(type==='x'){t.w=X;t.h=1;el.textContent='x';}
  else{t.w=1;t.h=1;el.textContent='1';}
  t.el=el; sizeTile(t);
  el.addEventListener('mousedown',e=>onDown(e,t));
  el.addEventListener('dblclick',e=>{e.preventDefault();doRotate(t);});  // double-click = rotate
  return t;
}
function sizeTile(t){ t.el.style.width=(t.w*CELL-2)+'px'; t.el.style.height=(t.h*CELL-2)+'px'; }

/* ---- load a question ---- */
function loadQuestion(){
  solved=false; tiles=[]; seq=0;
  workspace.querySelectorAll('.tile').forEach(n=>n.remove());
  tray.innerHTML=''; clearSuccessUI();
  Q=session[qIndex];
  document.getElementById('expr').innerHTML=GAME.exprHTML(Q);
  document.getElementById('qnum').textContent=qIndex+1;
  document.getElementById('score').textContent=score;
  document.getElementById('nextBtn').disabled=true;
  document.getElementById('result').className='result';
  document.getElementById('result').innerHTML='';
  for(const s of GAME.supply(Q)) for(let i=0;i<s.n;i++) tiles.push(makeTile(s.type));
  tiles.forEach(t=>tray.appendChild(t.el));
}

/* ---- DRAG & DROP (mouse events) ----
   A tile is only "lifted" once the pointer moves past a small threshold, so a
   plain click (or double-click) never reparents the node. That lets the native
   dblclick fire reliably for the rotate gesture. */
let drag=null,grabX=0,grabY=0,startX=0,startY=0,lifted=false;
function onDown(e,t){
  if(solved) return;
  e.preventDefault();
  drag=t; lifted=false; startX=e.clientX; startY=e.clientY;
  const r=t.el.getBoundingClientRect();
  grabX=e.clientX-r.left; grabY=e.clientY-r.top;
  t.prevPlaced=t.placed; t.prevX=t.gx; t.prevY=t.gy;
}
function lift(){                                   // begin an actual drag
  lifted=true; drag.placed=false;                  // free its cells while dragging
  document.body.appendChild(drag.el);
  drag.el.classList.add('dragging');
  drag.el.style.position='fixed'; drag.el.style.zIndex=1000;
}
function moveTo(cx,cy){ drag.el.style.left=(cx-grabX)+'px'; drag.el.style.top=(cy-grabY)+'px'; }
document.addEventListener('mousemove',e=>{
  if(!drag) return;
  if(!lifted){ if(Math.abs(e.clientX-startX)>4||Math.abs(e.clientY-startY)>4) lift(); else return; }
  moveTo(e.clientX,e.clientY);
});
document.addEventListener('mouseup',e=>{
  if(!drag) return;
  const t=drag; drag=null;
  if(!lifted) return;                              // a click, not a drag — leave the tile; dblclick rotates
  lifted=false;
  t.el.classList.remove('dragging'); t.el.style.zIndex='';
  // SNAP-TO-GRID: nearest cell to the tile's top-left, clamped in bounds
  const ws=workspace.getBoundingClientRect(), r=t.el.getBoundingClientRect();
  const inside=r.left+r.width/2>ws.left&&r.left+r.width/2<ws.right&&
               r.top+r.height/2>ws.top&&r.top+r.height/2<ws.bottom;
  if(inside){
    let gx=Math.round((r.left-ws.left)/CELL), gy=Math.round((r.top-ws.top)/CELL);
    gx=Math.max(0,Math.min(GRID-t.w,gx)); gy=Math.max(0,Math.min(GRID-t.h,gy));
    if(canPlace(t,gx,gy)) placeTile(t,gx,gy); else restore(t);
  } else returnToTray(t);
  checkWin();
});

/* double-click an x-tile to rotate 90° (in tray or in place) */
function doRotate(t){
  if(solved||t.type!=='x') return;
  const wasPlaced=t.placed, gx=t.gx, gy=t.gy;
  if(wasPlaced) t.placed=false;                    // free cells before re-checking fit
  t.orientation=t.orientation==='h'?'v':'h';
  [t.w,t.h]=[t.h,t.w]; sizeTile(t);
  if(wasPlaced){ if(canPlace(t,gx,gy)) placeTile(t,gx,gy); else returnToTray(t); }
  checkWin();
}

function restore(t){
  if(t.prevPlaced && canPlace(t,t.prevX,t.prevY)) placeTile(t,t.prevX,t.prevY);
  else returnToTray(t);
}

/* COLLISION: true if every needed cell is empty (dragged tile is already freed) */
function canPlace(t,gx,gy){
  if(gx<0||gy<0||gx+t.w>GRID||gy+t.h>GRID) return false;
  const occ=occupancy();
  for(let y=gy;y<gy+t.h;y++) for(let x=gx;x<gx+t.w;x++) if(occ[y][x]) return false;
  return true;
}
function occupancy(){
  const g=Array.from({length:GRID},()=>new Array(GRID).fill(0));
  for(const t of tiles){ if(!t.placed) continue;
    for(let y=t.gy;y<t.gy+t.h;y++) for(let x=t.gx;x<t.gx+t.w;x++) g[y][x]=t.id; }
  return g;
}
function placeTile(t,gx,gy){
  t.placed=true; t.gx=gx; t.gy=gy;
  workspace.appendChild(t.el);
  t.el.style.position='absolute'; t.el.style.left=(gx*CELL)+'px'; t.el.style.top=(gy*CELL)+'px';
}
function returnToTray(t){
  t.placed=false; t.el.style.position='static'; t.el.style.left=''; t.el.style.top='';
  tray.appendChild(t.el);
}

/* ---- WIN DETECTION: all tiles placed + solid filled rectangle, then GAME.check ---- */
function checkWin(){
  if(solved) return;
  if(tiles.some(t=>!t.placed)) return;
  let minX=GRID,minY=GRID,maxX=-1,maxY=-1,filled=0;
  const occ=occupancy();
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++) if(occ[y][x]){
    filled++; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  const bw=maxX-minX+1, bh=maxY-minY+1;
  if(bw*bh!==filled) return;                        // bounding box must be gap-free
  const r=GAME.check(Q,bw,bh);
  if(r) onSuccess(r,minX,minY,bw,bh);
}

/* ---- SUCCESS: highlight the two factor edges, label them, show the identity ---- */
function onSuccess(r,minX,minY,bw,bh){
  solved=true; score++;
  document.getElementById('score').textContent=score;
  const res=document.getElementById('result');
  res.className='result win';
  res.innerHTML=`<div class="cheer">${r.cheer}</div><div class="factored">${r.identity}</div>`;
  const top=document.getElementById('dimTop'), left=document.getElementById('dimLeft');
  top.style.display='flex'; top.style.left=(34+minX*CELL)+'px'; top.style.width=(bw*CELL)+'px'; top.innerHTML=r.topLabel;
  left.style.display='flex'; left.style.top=(34+minY*CELL)+'px'; left.style.height=(bh*CELL)+'px'; left.innerHTML=r.leftLabel;
  const hiTop=document.getElementById('hiTop');
  hiTop.style.display='block'; hiTop.style.left=(minX*CELL)+'px'; hiTop.style.top=(minY*CELL)+'px';
  hiTop.style.width=(bw*CELL)+'px'; hiTop.style.height=CELL+'px';
  const hiLeft=document.getElementById('hiLeft');
  hiLeft.style.display='block'; hiLeft.style.left=(minX*CELL)+'px'; hiLeft.style.top=(minY*CELL)+'px';
  hiLeft.style.width=CELL+'px'; hiLeft.style.height=(bh*CELL)+'px';
  document.getElementById('nextBtn').disabled=false;
}
function clearSuccessUI(){
  ['dimTop','dimLeft','hiTop','hiLeft'].forEach(id=>document.getElementById(id).style.display='none');
}

/* ---- CONTROLS ---- */
document.getElementById('resetBtn').addEventListener('click',()=>{ if(!solved) tiles.forEach(returnToTray); });
document.getElementById('hintBtn').addEventListener('click',()=>{   // flash the x²-tile's corner
  const c=document.getElementById('cornerHint');
  c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
});
document.getElementById('nextBtn').addEventListener('click',()=>{
  qIndex++; if(qIndex>=session.length){ showEndCard(); return; } loadQuestion();
});
function showEndCard(){
  document.querySelector('main').innerHTML=
    `<div class="panel endcard"><h2>Session complete! 🏆</h2>
       <p style="font-size:18px">You solved <b>${score}</b> of ${session.length}.</p>
       <button class="primary" onclick="location.reload()">Play again</button></div>`;
}

/* ---- boot ---- */
document.getElementById('goal').textContent=GAME.goal;
loadQuestion();
</script>
</body>
</html>
