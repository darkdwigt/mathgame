<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebra Tiles — Factoring Trinomials</title>
<style>
  /* ===== SHARED THEME (identical across all algebra-tile games) ===== */
  :root{
    --cell:44px;
    --x2:#2dd4bf; --x2dark:#0f9488;
    --x:#4ade80; --xdark:#16a34a;
    --unit:#fbbf24; --unitdark:#d97706;
    --bg:#fff6e0; --paper:#fffdf5; --line:#ffe1a8;
    --ink:#2b2350; --good:#2ec27e; --bad:#ff4d6d;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Baloo 2","Comic Sans MS","Chalkboard SE","Marker Felt",Verdana,sans-serif;
    background:
      radial-gradient(circle at 10% 10%, #fff0c9 0, transparent 40%),
      radial-gradient(circle at 90% 20%, #d8f5ff 0, transparent 40%),
      var(--bg);
    color:var(--ink); -webkit-user-select:none; user-select:none;
    min-height:100vh; touch-action:pan-y;
  }
  header{background:#fff;border-bottom:4px dashed #ffcf70;padding:16px 24px;
         display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  header h1{font-size:24px;margin:0;font-weight:800;color:#ff6f3c;}
  header .meta{margin-left:auto;display:flex;gap:20px;font-size:16px;font-weight:700;}
  header .meta span b{color:var(--x2dark);}
  main{max-width:1280px;margin:0 auto;padding:22px 20px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .panel{background:var(--paper);border:3px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 0 var(--line);}

  .left{flex:0 0 280px;display:flex;flex-direction:column;gap:16px;}
  .problem{text-align:center;}
  .problem .label{font-size:13px;color:#a86f00;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .problem .expr{font-size:34px;font-weight:800;margin:8px 0 0;}
  .problem .expr sup{font-size:.6em;vertical-align:super;}
  .result{margin-top:14px;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;}
  .result.win .factored{font-size:24px;font-weight:800;color:var(--x2dark);animation:pop .5s ease;}
  .result .cheer{font-size:15px;color:var(--good);font-weight:700;}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1)}}

  .controls{display:flex;flex-direction:column;gap:10px;}
  button{font:inherit;font-weight:800;padding:12px 14px;border-radius:14px;border:3px solid var(--line);
         background:#fff;cursor:pointer;transition:.12s;box-shadow:0 3px 0 var(--line);}
  button:hover{transform:translateY(1px);box-shadow:0 2px 0 var(--line);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--good);color:#fff;border-color:#1f9c62;box-shadow:0 3px 0 #1f9c62;}
  button.primary:hover{background:#27b072;}
  .legend{font-size:13px;color:#5b4a8a;line-height:1.7;font-weight:600;}
  .legend .swatch{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:middle;margin-right:6px;}

  .center{flex:1 1 480px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;}
  .board-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;display:flex;justify-content:center;}
  .stage{position:relative;padding:34px 0 0 34px;flex:0 0 auto;}
  #workspace{position:relative;
    width:calc(var(--cell) * 10);height:calc(var(--cell) * 10);
    background:var(--paper);border:3px dashed #ffcf70;border-radius:12px;
    background-image:linear-gradient(to right,#ffedc4 1px,transparent 1px),
                     linear-gradient(to bottom,#ffedc4 1px,transparent 1px);
    background-size:var(--cell) var(--cell);}
  .hint-msg{font-size:14px;color:#a86f00;font-weight:700;min-height:18px;}

  .dimlabel{position:absolute;font-weight:800;color:var(--x2dark);font-size:17px;display:none;align-items:center;justify-content:center;}
  .dimlabel.top{top:8px;height:24px;border-bottom:3px solid var(--x2dark);}
  .dimlabel.left{left:6px;width:24px;writing-mode:vertical-rl;transform:rotate(180deg);border-right:3px solid var(--x2dark);}
  .edgehi{position:absolute;background:rgba(15,148,136,.16);display:none;pointer-events:none;border:1px dashed var(--x2dark);}
  .corner-hint{position:absolute;left:0;top:0;width:calc(var(--cell)*3);height:calc(var(--cell)*3);
    border:3px dashed var(--x2dark);border-radius:6px;background:rgba(45,212,191,.16);display:none;pointer-events:none;}
  .corner-hint.show{display:block;animation:flash 1.6s ease;}
  @keyframes flash{0%,100%{opacity:0}20%,80%{opacity:1}}

  .right{flex:1 1 320px;min-width:280px;}
  .right h2{font-size:15px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.05em;color:#a86f00;font-weight:800;}
  .right .hint{font-size:13px;color:#8a7bb8;margin:0 0 12px;font-weight:600;}
  #tray{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;min-height:120px;}

  .tile{position:relative;border-radius:8px;
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;
    cursor:grab;touch-action:none;}
  .tile.dragging{cursor:grabbing;box-shadow:0 8px 18px rgba(0,0,0,.3);opacity:.94;}
  .tile.x2{background:var(--x2);border:2px solid var(--x2dark);box-shadow:0 3px 0 var(--x2dark);font-size:18px;}
  .tile.x{background:var(--x);border:2px solid var(--xdark);box-shadow:0 3px 0 var(--xdark);font-size:15px;}
  .tile.unit{background:var(--unit);border:2px solid var(--unitdark);box-shadow:0 3px 0 var(--unitdark);font-size:12px;}
  .tile sup{font-size:.6em;vertical-align:super;}

  .endcard{flex:1 1 100%;text-align:center;padding:30px;}
  .endcard h2{font-size:26px;color:#ff6f3c;}

  @media (max-width:900px){
    main{flex-direction:column;align-items:stretch;}
    .left,.center,.right{flex:1 1 auto;width:100%;min-width:0;}
  }
</style>
</head>
<body>

<header>
  <h1>🔷 Algebra Tiles — Factoring Trinomials</h1>
  <div class="meta">
    <span>Question <b id="qnum">1</b>/10</span>
    <span>Score <b id="score">0</b></span>
  </div>
</header>

<main>
  <section class="left">
    <div class="panel problem">
      <div class="label" id="prompt">Factor this trinomial</div>
      <div class="expr" id="expr"></div>
      <div class="result" id="result"></div>
    </div>
    <div class="panel controls">
      <button class="primary" id="nextBtn" disabled>Next →</button>
      <button id="resetBtn">↺ Reset workspace</button>
      <button id="hintBtn">💡 Show hint</button>
    </div>
    <div class="panel legend">
      <div><span class="swatch" style="background:var(--x2)"></span> x²-tile (x by x)</div>
      <div><span class="swatch" style="background:var(--x)"></span> x-tile (x by 1)</div>
      <div><span class="swatch" style="background:var(--unit)"></span> unit-tile (1 by 1)</div>
    </div>
  </section>

  <section class="center">
    <div class="board-wrap">
      <div class="stage">
        <div class="dimlabel top" id="dimTop"></div>
        <div class="dimlabel left" id="dimLeft"></div>
        <div id="workspace">
          <div class="edgehi" id="hiTop"></div>
          <div class="edgehi" id="hiLeft"></div>
          <div class="corner-hint" id="cornerHint"></div>
        </div>
      </div>
    </div>
    <div class="hint-msg" id="goal"></div>
  </section>

  <section class="right panel">
    <h2>Tile supply</h2>
    <p class="hint">Drag tiles onto the grid. Double-tap an x-tile to rotate it 90°.</p>
    <div id="tray"></div>
  </section>
</main>

<script>
"use strict";

/* =========================================================================
   GAME CONFIG  — the ONLY part that differs between algebra-tile games.
   (See CLAUDE.md for the shared contract.)
   ========================================================================= */
const GAME = {
  goal: "Arrange every tile into one solid rectangle — no gaps, no overlaps.",

  // 10 distinct monic trinomials from factor pairs 1<=p<=q<=4, shuffled.
  buildSession(){
    const qs=[];
    for(let p=1;p<=4;p++) for(let q=p;q<=4;q++) qs.push({p,q,b:p+q,c:p*q});
    for(let i=qs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qs[i],qs[j]]=[qs[j],qs[i]];}
    return qs;
  },
  exprHTML(Q){ return `x<sup>2</sup> + ${Q.b}x + ${Q.c}`; },
  supply(Q){ return [{type:'x2',n:1},{type:'x',n:Q.b},{type:'unit',n:Q.c}]; },

  // win when the filled rectangle's sides give the correct factors
  check(Q,w,h){
    const f1=w-X, f2=h-X;            // a side of length L cells = "x + (L-X)"
    if(f1>=1 && f2>=1 && f1+f2===Q.b && f1*f2===Q.c){
      return {identity:`(x + ${f1})(x + ${f2})`, topLabel:`x + ${f1}`, leftLabel:`x + ${f2}`, cheer:'🎉 Correct!'};
    }
    return null;
  }
};

/* =========================================================================
   SHARED ENGINE  — identical in every algebra-tile game. Do not fork.
   Drag uses Pointer Events (mouse, touch, and pen all fire the same events),
   so every game works on tablets and touchscreens as well as desktop.
   ========================================================================= */
const X=3, GRID=10, CELL=44;
const workspace=document.getElementById('workspace');
const tray=document.getElementById('tray');

let session=GAME.buildSession();
let qIndex=0, score=0, tiles=[], solved=false, Q=null, seq=0;

/* ---- tile factory ---- */
function makeTile(type){
  const t={id:++seq,type,orientation:'h',placed:false,gx:0,gy:0,lastTapTime:-1e9};
  const el=document.createElement('div');
  el.className='tile '+type;
  if(type==='x2'){t.w=X;t.h=X;el.innerHTML='x<sup>2</sup>';}
  else if(type==='x'){t.w=X;t.h=1;el.textContent='x';}
  else{t.w=1;t.h=1;el.textContent='1';}
  t.el=el; sizeTile(t);
  el.addEventListener('pointerdown',e=>onDown(e,t));
  return t;
}
function sizeTile(t){ t.el.style.width=(t.w*CELL-2)+'px'; t.el.style.height=(t.h*CELL-2)+'px'; }

/* ---- load a question ---- */
function loadQuestion(){
  solved=false; tiles=[]; seq=0;
  workspace.querySelectorAll('.tile').forEach(n=>n.remove());
  tray.innerHTML=''; clearSuccessUI();
  Q=session[qIndex];
  document.getElementById('expr').innerHTML=GAME.exprHTML(Q);
  document.getElementById('qnum').textContent=qIndex+1;
  document.getElementById('score').textContent=score;
  document.getElementById('nextBtn').disabled=true;
  document.getElementById('result').className='result';
  document.getElementById('result').innerHTML='';
  for(const s of GAME.supply(Q)) for(let i=0;i<s.n;i++) tiles.push(makeTile(s.type));
  tiles.forEach(t=>tray.appendChild(t.el));
}

/* ---- DRAG & DROP (Pointer Events: mouse + touch + pen) ----
   A tile is only "lifted" once the pointer moves past a small threshold, so a
   plain tap/click never reparents the node. That lets a quick double tap/click
   on the same spot register as the rotate gesture instead of a drag. */
let drag=null,grabX=0,grabY=0,startX=0,startY=0,lifted=false;
function onDown(e,t){
  if(solved) return;
  e.preventDefault();
  drag=t; lifted=false; startX=e.clientX; startY=e.clientY;
  const r=t.el.getBoundingClientRect();
  grabX=e.clientX-r.left; grabY=e.clientY-r.top;
  t.prevPlaced=t.placed; t.prevX=t.gx; t.prevY=t.gy;
}
function lift(){                                   // begin an actual drag
  lifted=true; drag.placed=false;                  // free its cells while dragging
  document.body.appendChild(drag.el);
  drag.el.classList.add('dragging');
  drag.el.style.position='fixed'; drag.el.style.zIndex=1000;
}
function moveTo(cx,cy){ drag.el.style.left=(cx-grabX)+'px'; drag.el.style.top=(cy-grabY)+'px'; }
document.addEventListener('pointermove',e=>{
  if(!drag) return;
  if(!lifted){ if(Math.abs(e.clientX-startX)>4||Math.abs(e.clientY-startY)>4) lift(); else return; }
  moveTo(e.clientX,e.clientY);
});
function endDrag(){
  if(!drag) return;
  const t=drag; drag=null;
  if(!lifted){                                     // a tap/click, not a drag
    const now=performance.now();
    if(t.type==='x' && now-t.lastTapTime<350){ t.lastTapTime=0; doRotate(t); }
    else t.lastTapTime=now;
    return;
  }
  lifted=false;
  t.el.classList.remove('dragging'); t.el.style.zIndex='';
  // SNAP-TO-GRID: nearest cell to the tile's top-left, clamped in bounds
  const ws=workspace.getBoundingClientRect(), r=t.el.getBoundingClientRect();
  const inside=r.left+r.width/2>ws.left&&r.left+r.width/2<ws.right&&
               r.top+r.height/2>ws.top&&r.top+r.height/2<ws.bottom;
  if(inside){
    let gx=Math.round((r.left-ws.left)/CELL), gy=Math.round((r.top-ws.top)/CELL);
    gx=Math.max(0,Math.min(GRID-t.w,gx)); gy=Math.max(0,Math.min(GRID-t.h,gy));
    if(canPlace(t,gx,gy)) placeTile(t,gx,gy); else restore(t);
  } else returnToTray(t);
  checkWin();
}
document.addEventListener('pointerup',endDrag);
document.addEventListener('pointercancel',endDrag);

/* double-tap (or double-click) an x-tile to rotate 90° (in tray or in place) */
function doRotate(t){
  if(solved||t.type!=='x') return;
  const wasPlaced=t.placed, gx=t.gx, gy=t.gy;
  if(wasPlaced) t.placed=false;                    // free cells before re-checking fit
  t.orientation=t.orientation==='h'?'v':'h';
  [t.w,t.h]=[t.h,t.w]; sizeTile(t);
  if(wasPlaced){ if(canPlace(t,gx,gy)) placeTile(t,gx,gy); else returnToTray(t); }
  checkWin();
}

function restore(t){
  if(t.prevPlaced && canPlace(t,t.prevX,t.prevY)) placeTile(t,t.prevX,t.prevY);
  else returnToTray(t);
}

/* COLLISION: true if every needed cell is empty (dragged tile is already freed) */
function canPlace(t,gx,gy){
  if(gx<0||gy<0||gx+t.w>GRID||gy+t.h>GRID) return false;
  const occ=occupancy();
  for(let y=gy;y<gy+t.h;y++) for(let x=gx;x<gx+t.w;x++) if(occ[y][x]) return false;
  return true;
}
function occupancy(){
  const g=Array.from({length:GRID},()=>new Array(GRID).fill(0));
  for(const t of tiles){ if(!t.placed) continue;
    for(let y=t.gy;y<t.gy+t.h;y++) for(let x=t.gx;x<t.gx+t.w;x++) g[y][x]=t.id; }
  return g;
}
function placeTile(t,gx,gy){
  t.placed=true; t.gx=gx; t.gy=gy;
  workspace.appendChild(t.el);
  t.el.style.position='absolute'; t.el.style.left=(gx*CELL)+'px'; t.el.style.top=(gy*CELL)+'px';
}
function returnToTray(t){
  t.placed=false; t.el.style.position='static'; t.el.style.left=''; t.el.style.top='';
  tray.appendChild(t.el);
}

/* ---- WIN DETECTION: all tiles placed + solid filled rectangle, then GAME.check ---- */
function checkWin(){
  if(solved) return;
  if(tiles.some(t=>!t.placed)) return;
  let minX=GRID,minY=GRID,maxX=-1,maxY=-1,filled=0;
  const occ=occupancy();
  for(let y=0;y<GRID;y++) for(let x=0;x<GRID;x++) if(occ[y][x]){
    filled++; if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y;
  }
  const bw=maxX-minX+1, bh=maxY-minY+1;
  if(bw*bh!==filled) return;                        // bounding box must be gap-free
  const r=GAME.check(Q,bw,bh);
  if(r) onSuccess(r,minX,minY,bw,bh);
}

/* ---- SUCCESS: highlight the two factor edges, label them, show the identity ---- */
function onSuccess(r,minX,minY,bw,bh){
  solved=true; score++;
  document.getElementById('score').textContent=score;
  const res=document.getElementById('result');
  res.className='result win';
  res.innerHTML=`<div class="cheer">${r.cheer}</div><div class="factored">${r.identity}</div>`;
  const top=document.getElementById('dimTop'), left=document.getElementById('dimLeft');
  top.style.display='flex'; top.style.left=(34+minX*CELL)+'px'; top.style.width=(bw*CELL)+'px'; top.innerHTML=r.topLabel;
  left.style.display='flex'; left.style.top=(34+minY*CELL)+'px'; left.style.height=(bh*CELL)+'px'; left.innerHTML=r.leftLabel;
  const hiTop=document.getElementById('hiTop');
  hiTop.style.display='block'; hiTop.style.left=(minX*CELL)+'px'; hiTop.style.top=(minY*CELL)+'px';
  hiTop.style.width=(bw*CELL)+'px'; hiTop.style.height=CELL+'px';
  const hiLeft=document.getElementById('hiLeft');
  hiLeft.style.display='block'; hiLeft.style.left=(minX*CELL)+'px'; hiLeft.style.top=(minY*CELL)+'px';
  hiLeft.style.width=CELL+'px'; hiLeft.style.height=(bh*CELL)+'px';
  document.getElementById('nextBtn').disabled=false;
}
function clearSuccessUI(){
  ['dimTop','dimLeft','hiTop','hiLeft'].forEach(id=>document.getElementById(id).style.display='none');
}

/* ---- CONTROLS ---- */
document.getElementById('resetBtn').addEventListener('click',()=>{ if(!solved) tiles.forEach(returnToTray); });
document.getElementById('hintBtn').addEventListener('click',()=>{   // flash the x²-tile's corner
  const c=document.getElementById('cornerHint');
  c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
});
document.getElementById('nextBtn').addEventListener('click',()=>{
  qIndex++; if(qIndex>=session.length){ showEndCard(); return; } loadQuestion();
});
function showEndCard(){
  document.querySelector('main').innerHTML=
    `<div class="panel endcard"><h2>Session complete! 🏆</h2>
       <p style="font-size:18px">You solved <b>${score}</b> of ${session.length}.</p>
       <button class="primary" onclick="location.reload()">Play again</button></div>`;
}

/* ---- boot ---- */
document.getElementById('goal').textContent=GAME.goal;
loadQuestion();
</script>
</body>
</html>
